<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(to bottom, #1a0b2e, #0d0d1a); color: white; font-family: sans-serif; padding-bottom: 70px; }
        .header { padding: 20px; }
        .profile-card { display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 20px; border: 1px solid #9b30ff; box-shadow: 0 0 15px rgba(155, 48, 255, 0.3); }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #00ffff; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: #000; box-shadow: 0 0 10px #00ffff; }
        .user-info h3 { margin: 0 0 5px 0; font-size: 18px; }
        .user-info p { margin: 0; font-size: 12px; color: #aaa; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: #222; border-radius: 15px; overflow: hidden; border: 1px solid #333; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .thumb { width: 100%; height: 110px; background: #444; display: flex; justify-content: center; align-items: center; color: #888; }
        .card-info { padding: 10px; }
        .card-info p { margin: 0 0 5px 0; font-size: 14px; font-weight: bold; }
        .card-info small { color: #888; }
        .btn { display: block; width: 90%; margin: 10px auto; padding: 15px; background: linear-gradient(to right, #ff00cc, #333399); border: none; border-radius: 25px; color: white; font-size: 16px; font-weight: bold; text-align: center; box-shadow: 0 0 15px #ff00cc; cursor: pointer; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #111; padding: 15px 0; border-top: 1px solid #9b30ff; }
        .nav-item { text-align: center; color: #888; font-size: 12px; font-weight: bold; }
        .nav-item.active { color: #ff00cc; text-shadow: 0 0 5px #ff00cc; }
    </style>
</head>
<body>
    <div class="header">
        <div class="profile-card">
            <div class="avatar" id="user-initial">U</div>
            <div class="user-info">
                <h3 id="user-name">লোড হচ্ছে...</h3>
                <p id="user-id">@username</p>
            </div>
        </div>
    </div>

    <h3 style="padding-left: 15px; margin-bottom: 0;">🔥 হট ভিডিও</h3>
    <div class="grid">
        <div class="card">
            <div class="thumb">Thumbnail 1</div>
            <div class="card-info">
                <p>GTA V Gameplay</p>
                <small>10K Views</small>
            </div>
        </div>
        <div class="card">
            <div class="thumb">Thumbnail 2</div>
            <div class="card-info">
                <p>Free Fire Highlights</p>
                <small>25K Views</small>
            </div>
        </div>
    </div>

    <button class="btn">Watch Ad to Unlock</button>

    <div class="nav">
        <div class="nav-item active">🏠<br>হোম</div>
        <div class="nav-item">🎁<br>রিওয়ার্ড</div>
        <div class="nav-item">📢<br>চ্যানেল</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-id').innerText = '@' + (tg.initDataUnsafe.user.username || 'No_Username');
            document.getElementById('user-initial').innerText = tg.initDataUnsafe.user.first_name.charAt(0).toUpperCase();
        }
    </script>
</body>
              </html>
